name: CI

on:
  pull_request:
    branches: ["*"]
  merge_group:
  # Gates nothing: it saves the caches that pull requests and the merge queue restore.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 3
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      # Runs on each push, not on a title edit: the default `pull_request` types leave `edited` out.
      - name: Keep "claude" out of the branch name and PR title
        run: node scripts/check-pr-names.ts --branch="$PR_HEAD_REF" --title="$PR_TITLE"
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}

  changesets:
    name: Changesets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - name: Block >= 1.0.0 while in 0.x
        run: pnpm check-no-major

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  knip:
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: pnpm knip

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # drizzle-kit imports `plumix/schema`, which resolves to `dist/`.
      - run: pnpm exec turbo run build --filter plumix
      - run: pnpm migrations:check

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm i18n:check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - run: pnpm test:unit

  sandcastle:
    name: Sandcastle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: pnpm --dir .sandcastle install --frozen-lockfile
      - run: pnpm --dir .sandcastle typecheck
      - run: pnpm --dir .sandcastle test
      - run: pnpm --dir .sandcastle run ship --status
      - run: pnpm --dir .sandcastle run ship --report

  # Twelve combos took 3-4 min on one runner, run one after another. CPU bounds them, so each
  # shard runs its combos in parallel on its own runner. `SMOKE_SHARD` takes every third combo, so
  # a combo a new runtime or plugin adds runs somewhere.
  smoke-shard:
    name: Smoke (scaffold, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
          playwright-save: ${{ matrix.shard == 1 }}
          turbo-cache-key: ${{ matrix.shard }}
      - run: pnpm smoke:scaffold
        env:
          SMOKE_SHARD: ${{ matrix.shard }}/3

      # Where the editor spec each all-plugins combo runs under `plumix dev` writes them.
      # Explicit paths, not `**/…`: that globber follows symlinks through `node_modules/.pnpm`.
      - name: Upload Playwright reports + traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-playwright-reports-${{ matrix.shard }}
          path: |
            packages/create-plumix-app/playwright-report/
            packages/create-plumix-app/test-results/
          if-no-files-found: warn
          retention-days: 5

  # As `test-e2e` below: one result for the shards, failing on a failed, cancelled or skipped one.
  smoke:
    name: Smoke (scaffold)
    needs: smoke-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$SHARDS" = success
        env:
          SHARDS: ${{ needs.smoke-shard.result }}

  # On a core change, one runner took 16 min (#3761): admin's suite waits on core's and seo's
  # (packages/admin/turbo.json), and core runs 298 specs on one worker. That chain is split with
  # Playwright's `--shard`, which turbo hands every suite it runs; turbo hashes the argument, so
  # each shard caches on its own. The other suites split by package, at most four per runner as
  # the root script's `--concurrency=4` allows. `suites-c` takes every suite no other entry
  # names, so a new suite runs somewhere.
  test-e2e-shard:
    name: Test (e2e, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: chain-1
            turbo: --filter=@plumix/core --filter=@plumix/admin -- --shard=1/8
          - shard: chain-2
            turbo: --filter=@plumix/core --filter=@plumix/admin -- --shard=2/8
          - shard: chain-3
            turbo: --filter=@plumix/core --filter=@plumix/admin -- --shard=3/8
          - shard: chain-4
            turbo: --filter=@plumix/core --filter=@plumix/admin -- --shard=4/8
          - shard: chain-5
            turbo: --filter=@plumix/core --filter=@plumix/admin -- --shard=5/8
          - shard: chain-6
            turbo: --filter=@plumix/core --filter=@plumix/admin -- --shard=6/8
          - shard: chain-7
            turbo: --filter=@plumix/core --filter=@plumix/admin -- --shard=7/8
          - shard: chain-8
            turbo: --filter=@plumix/core --filter=@plumix/admin -- --shard=8/8
          - shard: suites-a
            turbo: >-
              --filter=@plumix-apps/demo --filter=@plumix/plugin-forms
              --filter=@plumix/admin-editor
          - shard: suites-b
            turbo: >-
              --filter=@plumix/plugin-menu --filter=@plumix/plugin-blog
              --filter=@plumix/runtime-cloudflare --filter=@plumix/plugin-media
          - shard: suites-c
            turbo: >-
              --filter=!@plumix/core --filter=!@plumix/admin --filter=!@plumix/plugin-seo
              --filter=!@plumix-apps/demo --filter=!@plumix/plugin-forms
              --filter=!@plumix/admin-editor --filter=!@plumix/plugin-menu
              --filter=!@plumix/plugin-blog --filter=!@plumix/runtime-cloudflare
              --filter=!@plumix/plugin-media
            screenshots: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
          turbo-cache-key: ${{ matrix.shard }}

      # `--concurrency=4` as the root `test:e2e` script sets it; turbo.json says why.
      - run: |
          read -ra args <<< "$TURBO_ARGS"
          pnpm exec turbo run test:e2e --concurrency=4 "${args[@]}"
        env:
          TURBO_ARGS: ${{ matrix.turbo }}

      # No `if: always()`: playwright clears `playwright-report/` and `test-results/` as it
      # starts, which would delete a failed suite's artifacts before the upload below.
      - name: Assert the committed docs screenshots are the ones the capture produces
        id: screenshots
        if: matrix.screenshots
        run: |
          pnpm docs:screenshots
          git diff --exit-code -- apps/docs/src/assets/screenshots

      - name: Upload the recaptured screenshots
        if: failure() && steps.screenshots.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-screenshots
          path: apps/docs/src/assets/screenshots
          retention-days: 7

      # Explicit paths, not `**/…`: that globber follows symlinks through `node_modules/.pnpm`.
      - name: Upload Playwright reports + traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-reports-${{ matrix.shard }}
          path: |
            packages/*/playwright-report/
            packages/*/*/playwright-report/
            apps/*/playwright-report/
            packages/*/test-results/
            packages/*/*/test-results/
            apps/*/test-results/
          if-no-files-found: warn
          retention-days: 5

  # The required check. `always()` so a failed, cancelled or skipped shard fails it rather than
  # skipping it, which branch protection would read as passing.
  test-e2e:
    name: Test (e2e)
    needs: test-e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$SHARDS" = success
        env:
          SHARDS: ${{ needs.test-e2e-shard.result }}

  # Each job on main saves a turbo entry under a new key; keep only the newest per job.
  prune-turbo-cache:
    name: Prune turbo cache
    if: always() && github.event_name == 'push'
    needs:
      - lint
      - format
      - typecheck
      - migrations
      - i18n
      - test
      - smoke-shard
      - test-e2e-shard
      - publint
      - attw
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: |
          gh cache list --ref refs/heads/main --key turbo- --limit 1000 --json id,key,createdAt \
            --jq 'group_by(.key | split("/")[0])[] | sort_by(.createdAt) | .[:-1][] | .id' |
            xargs -r -n1 gh cache delete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  publint:
    name: Publint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm publint
      - run: pnpm surface:check

  attw:
    name: Are The Types Wrong
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm attw

  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: typos
      - name: Spellcheck markdown
        run: git ls-files '*.md' '*.mdx' | xargs -r typos

  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A docs route (`/fields/text/`) is read as the `.mdx` file at that path.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --hidden --include-fragments --no-progress --extensions md,mdx
            --root-dir '${{ github.workspace }}/apps/docs/src/content/docs'
            --remap '^file://${{ github.workspace }}/apps/docs/src/content/docs/([^.#]+?)/?(#.*)?$ file://${{ github.workspace }}/apps/docs/src/content/docs/$1.mdx$2'
            .
          fail: true

  # The one check the branch ruleset requires, so adding or renaming a job above needs no ruleset
  # edit. `needs` lists every job in this workflow. A skipped job (Commitlint and Changesets on a
  # merge_group run) passes; a failed or cancelled one fails the gate.
  ci-ok:
    name: CI OK
    needs:
      - commitlint
      - changesets
      - lint
      - format
      - typecheck
      - knip
      - migrations
      - i18n
      - test
      - sandcastle
      - smoke-shard
      - smoke
      - test-e2e-shard
      - test-e2e
      - publint
      - attw
      - spellcheck
      - links
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
        env:
          RESULTS: ${{ toJSON(needs) }}
