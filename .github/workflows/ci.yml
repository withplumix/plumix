name: CI

on:
  pull_request:
    branches: ["*"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 3
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  changesets:
    name: Changesets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - name: Block >= 1.0.0 while in 0.x
        run: pnpm check-no-major

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  knip:
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: pnpm knip

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # drizzle-kit imports `plumix/schema`, which resolves to `dist/`.
      - run: pnpm exec turbo run build --filter plumix
      - run: pnpm migrations:check

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm i18n:check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - run: pnpm test:unit

  smoke:
    name: Smoke (scaffold)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      - run: pnpm smoke:scaffold

      # Where the editor spec each all-plugins combo runs under `plumix dev` writes them.
      # Explicit paths, not `**/…`: that globber follows symlinks through `node_modules/.pnpm`.
      - name: Upload Playwright reports + traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-playwright-reports
          path: |
            packages/create-plumix-app/playwright-report/
            packages/create-plumix-app/test-results/
          if-no-files-found: warn
          retention-days: 5

  test-e2e:
    name: Test (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: "true"

      - run: pnpm test:e2e

      # No `if: always()`: playwright clears `playwright-report/` and `test-results/` as it
      # starts, which would delete a failed suite's artifacts before the upload below.
      - name: Assert the committed docs screenshots are the ones the capture produces
        id: screenshots
        run: |
          pnpm docs:screenshots
          git diff --exit-code -- apps/docs/src/assets/screenshots

      - name: Upload the recaptured screenshots
        if: failure() && steps.screenshots.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-screenshots
          path: apps/docs/src/assets/screenshots
          retention-days: 7

      # Explicit paths, not `**/…`: that globber follows symlinks through `node_modules/.pnpm`.
      - name: Upload Playwright reports + traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-reports
          path: |
            packages/*/playwright-report/
            packages/*/*/playwright-report/
            apps/*/playwright-report/
            packages/*/test-results/
            packages/*/*/test-results/
            apps/*/test-results/
          if-no-files-found: warn
          retention-days: 5

  publint:
    name: Publint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm publint
      - run: pnpm surface:check

  attw:
    name: Are The Types Wrong
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm attw

  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: typos
      - name: Spellcheck markdown
        run: git ls-files '*.md' '*.mdx' | xargs -r typos

  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A docs route (`/fields/text/`) is read as the `.mdx` file at that path.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --hidden --include-fragments --no-progress --extensions md,mdx
            --root-dir '${{ github.workspace }}/apps/docs/src/content/docs'
            --remap '^file://${{ github.workspace }}/apps/docs/src/content/docs/([^.#]+?)/?(#.*)?$ file://${{ github.workspace }}/apps/docs/src/content/docs/$1.mdx$2'
            .
          fail: true
