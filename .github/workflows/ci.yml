name: CI

on:
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  bun-bench:
    name: Bun dev bench ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: bash .ci-bench/run.sh
