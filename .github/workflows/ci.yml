name: CI

on:
  pull_request:
    branches: ["*"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 3
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  changesets:
    name: Changesets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # We're deliberately in 0.x. A `major` changeset resolves straight to
      # 1.0.0 (changesets does no 0.x demotion), so block it from shipping as a
      # side effect of merging a feature PR — crossing 1.0 is a decision.
      - name: Block >= 1.0.0 while in 0.x
        run: pnpm check-no-major

  dependency-review:
    name: Dependency review
    # The admin build already refuses a copyleft dependency, but only for what
    # it bundles. This covers every other package, where a dependency reaches
    # consumers through their own build instead of ours.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A denylist, where the admin build uses an allowlist. GitHub reads scopes
      # from the lockfile and pnpm does not mark transitive dev dependencies, so
      # an allowlist here fails on build tooling that never ships — CC-BY-3.0
      # SPDX metadata, say. Naming the licenses that would actually contaminate
      # a published package keeps the check quiet enough to stay trusted. The
      # strict list still guards the one artifact we publish as a bundle.
      #
      # LGPL is deliberately absent: it covers native libraries we link rather
      # than copy, which carries no obligation we are failing to meet.
      # Vulnerabilities are Dependabot's job.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            SSPL-1.0, BUSL-1.1, CPAL-1.0, EUPL-1.2, OSL-3.0
          license-check: true
          vulnerability-check: false
          show-openssf-scorecard: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  knip:
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Catalogs are gitignored build output; generate them so core's
      # static catalog imports resolve before knip walks the graph.
      - run: pnpm exec turbo run i18n:compile
      - run: pnpm knip

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm i18n:check

  i18n-ratchet:
    name: i18n ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm i18n:ratchet:check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  test-build:
    name: Test (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # `*.build.test.ts` suites spin up a real Vite build and inspect the
      # emitted artifacts; the turbo task pulls the build graph.
      - run: pnpm test:build

  smoke:
    name: Smoke (scaffold)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The scaffolder packs every publishable package to redirect the
      # generated projects at this commit. It depends on none of them, so
      # turbo's `^build` won't build them — do it explicitly.
      #
      # Filtered because a bare `pnpm build` also builds `apps/*`, which it never
      # packs — `@plumix-apps/docs` above all, already covered by the `docs` job.
      # `smoke.mjs` throws for anything publishable it cannot pack, so nothing
      # keeps this filter in sync by hand.
      #
      # This used to build from source with the caches off, citing #1382. That
      # issue says the remote-cache 429s were "a red herring" and its real cause
      # — build and typecheck sharing one tsbuildinfo, so `dist` could silently
      # not emit — is fixed. Verified on a 29/29 cached build: the generated
      # projects still typecheck and build, and removing `dist` from one
      # plugin's `files` still fails the job.
      - run: pnpm exec turbo run build --filter './packages/**'
      - run: pnpm --filter create-plumix-app smoke:scaffold

  test-e2e:
    name: Test (e2e)
    runs-on: ubuntu-latest
    # The heaviest job (Playwright across admin + plugins) runs close to 10 min;
    # give it headroom so a slow/loaded runner doesn't cancel it mid-suite.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Cache the Playwright browser binaries (~120 MB) keyed on the resolved
      # @playwright/test version (declared via the pnpm catalog, so read the
      # installed version rather than the spec). System deps (apt libs like
      # libnss3) aren't cached cross-runner — they're reinstalled cheaply via
      # install-deps.
      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: |
          version=$(pnpm --filter @plumix/admin exec playwright --version | awk '{print $NF}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/admin
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit — browsers already there)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: packages/admin
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test:e2e

      # Running the capture is the check: markup that moved stops resolving by
      # test id and the command fails. No baselines, no pixel diff — see
      # packages/admin/README.md. A step rather than its own job because it
      # reuses the checkout, the build and the failure upload below; the images
      # it writes go with the runner.
      #
      # It renders in the pinned playwright container, not in the chromium
      # installed above, so this pulls that image on a cache miss. Turbo caches
      # the task now that its output no longer depends on the machine, so most
      # runs skip both.
      #
      # Deliberately no `if: always()`. This is a second playwright run in the
      # same package, and playwright clears `playwright-report/` and
      # `test-results/` as it starts — running it after a failed suite would
      # delete the artifacts the upload below exists to collect.
      - name: Assert docs screenshot capture succeeds
        run: pnpm docs:screenshots

      # The capture renders in a pinned container, so this runner writes the
      # bytes a contributor's machine writes. That makes the committed images
      # checkable rather than merely present: a diff here is either images that
      # were not regenerated alongside the admin change, or a container that
      # stopped being deterministic — both worth failing for. Skipped along
      # with the capture on a turbo cache hit, which is exactly when nothing
      # that could move a pixel changed.
      - name: Assert the committed images are the ones the capture produces
        run: git diff --exit-code -- apps/docs/src/assets/screenshots

      # `playwright-report/` is the HTML report; `test-results/` carries the
      # per-test artifacts that matter for diagnosing CI-only flakes —
      # `trace.zip`, `error-context.md`, screenshots, videos.
      #
      # Collected here rather than handed to upload-artifact as `**/…`. A
      # pattern with no literal prefix makes its globber search from the repo
      # root, and it follows symlinks by default — so it walks pnpm's
      # `node_modules/.pnpm` store once per workspace that links into it, and
      # reports the same directory twice (once directly, once through the
      # store). Measured on a tree this size: 56s wall / 366s CPU, against
      # milliseconds for the pruned walk below. Negations wouldn't help, since
      # `**` matches every directory, so nothing can be pruned early and the
      # exclusion only applies to results. That cost landed on the one step
      # that runs exclusively when the suite has already failed, so a failing
      # e2e run looked like a hang and burned the job's timeout.
      #
      # Staging under the original relative paths leaves the real entries where
      # the glob put them; only its duplicates are gone. `-prune` on the match
      # branch stops `find` descending into a report it has already claimed —
      # otherwise a nested pair copies twice, since `cp -R` into an existing
      # destination copies *into* it. A copy that fails annotates and the walk
      # continues: aborting would leave a partial artifact that reads as "those
      # workspaces produced nothing", which is the failure this step exists to
      # prevent.
      - name: Collect Playwright reports
        if: failure()
        shell: bash
        run: |
          stage="${RUNNER_TEMP}/playwright-reports"
          mkdir -p "$stage"
          find . -type d \( -name node_modules -o -name .git -o -name .turbo \) -prune -o \
                 -type d \( -name playwright-report -o -name test-results \) -prune -print0 |
            while IFS= read -r -d '' dir; do
              rel="${dir#./}"
              mkdir -p "$stage/$(dirname "$rel")" && cp -R "$dir" "$stage/$rel" ||
                echo "::warning::could not stage $rel"
            done

      - name: Upload Playwright reports + traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-reports
          path: ${{ runner.temp }}/playwright-reports
          if-no-files-found: warn
          retention-days: 5

  publint:
    name: Publint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm publint

  attw:
    name: Are The Types Wrong
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm attw

  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: typos
      # Markdown/prose only. Code + i18n catalogs carry their own vocabulary
      # (acronyms, identifiers, localized strings, deliberate test fixtures)
      # that would need a large allowlist for zero real bugs.
      - name: Spellcheck markdown
        run: git ls-files '*.md' '*.mdx' | xargs -r typos

  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Repository prose only — links here resolve against the file tree, docs
      # pages against Starlight's routing table. CONTRIBUTING.md "Link
      # validation" has the split; the `docs` job below is the other half.
      #
      # Offline: verify relative/local links resolve. External URLs are checked
      # weekly by link-check.yml so a flaky remote never blocks a PR.
      #
      # `--exclude-path` and not `--extensions md` is what holds the boundary:
      # Starlight serves `.md` as readily as `.mdx`, so one `.md` page in the
      # content tree would otherwise reach lychee, which resolves `/blocks/`
      # against the file tree and cannot find it. It is on this job rather than
      # in lychee.toml because the weekly job must still read those files — a
      # remote URL is remote whichever tree it sits in.
      #
      # `--hidden` reaches `.changeset/` and `.github/`, which lychee skips by
      # default. A directory rather than a glob — see lychee.toml.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--offline --hidden --include-fragments --no-progress --extensions md --exclude-path 'apps/docs/src/content/docs' ."
          fail: true

  docs:
    name: Docs (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # `starlight-links-validator` runs inside `astro build`, so building the
      # docs site is the link-and-anchor gate for every published page.
      - run: pnpm exec turbo run build --filter @plumix-apps/docs
