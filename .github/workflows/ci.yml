name: CI

on:
  pull_request:
    branches: ["*"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 3
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  changesets:
    name: Changesets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - name: Block >= 1.0.0 while in 0.x
        run: pnpm check-no-major

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A deny-list: GitHub cannot tell shipped dependencies from transitive dev tooling.
      # LGPL is absent on purpose; it covers native libraries we link, not copy.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            SSPL-1.0, BUSL-1.1, CPAL-1.0, EUPL-1.2, OSL-3.0
          vulnerability-check: false
          show-openssf-scorecard: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  knip:
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: pnpm knip

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # drizzle-kit imports `plumix/schema`, which resolves to `dist/`.
      - run: pnpm exec turbo run build --filter plumix
      - run: pnpm migrations:check

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm i18n:check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Restore only: the e2e job saves this cache, and two savers race for one key.
      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: |
          version=$(pnpm --filter @plumix/admin exec playwright --version | awk '{print $NF}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/admin
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit — browsers already there)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: packages/admin
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test:unit

  test-build:
    name: Test (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:build

  smoke:
    name: Smoke (scaffold)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The scaffolder packs these packages without depending on them, so `^build` skips them.
      - run: pnpm exec turbo run build --filter './packages/**'
      - run: pnpm --filter create-plumix-app smoke:scaffold

  test-e2e:
    name: Test (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: |
          version=$(pnpm --filter @plumix/admin exec playwright --version | awk '{print $NF}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/admin
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit — browsers already there)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: packages/admin
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test:e2e

      # No `if: always()`: playwright clears `playwright-report/` and `test-results/` as it
      # starts, which would delete a failed suite's artifacts before the upload below.
      - name: Assert docs screenshot capture succeeds
        run: pnpm docs:screenshots

      - name: Assert the committed images are the ones the capture produces
        id: screenshot-diff
        run: git diff --exit-code -- apps/docs/src/assets/screenshots

      - name: Upload the recaptured screenshots
        if: failure() && steps.screenshot-diff.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-screenshots
          path: apps/docs/src/assets/screenshots
          retention-days: 7

      # Not `**/…` in upload-artifact: its globber follows symlinks through `node_modules/.pnpm`,
      # which took about a minute and made a failing run look like a hang.
      - name: Collect Playwright reports
        if: failure()
        shell: bash
        run: |
          stage="${RUNNER_TEMP}/playwright-reports"
          mkdir -p "$stage"
          find . -type d \( -name node_modules -o -name .git -o -name .turbo \) -prune -o \
                 -type d \( -name playwright-report -o -name test-results \) -prune -print0 |
            while IFS= read -r -d '' dir; do
              rel="${dir#./}"
              mkdir -p "$stage/$(dirname "$rel")" && cp -R "$dir" "$stage/$rel" ||
                echo "::warning::could not stage $rel"
            done

      - name: Upload Playwright reports + traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-reports
          path: ${{ runner.temp }}/playwright-reports
          if-no-files-found: warn
          retention-days: 5

  publint:
    name: Publint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm publint

  attw:
    name: Are The Types Wrong
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm attw

  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: typos
      - name: Spellcheck markdown
        run: git ls-files '*.md' '*.mdx' | xargs -r typos

  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A docs route (`/fields/text/`) is read as the `.mdx` file at that path.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --hidden --include-fragments --no-progress --extensions md,mdx
            --root-dir '${{ github.workspace }}/apps/docs/src/content/docs'
            --remap '^file://${{ github.workspace }}/apps/docs/src/content/docs/([^.#]+?)/?(#.*)?$ file://${{ github.workspace }}/apps/docs/src/content/docs/$1.mdx$2'
            .
          fail: true
