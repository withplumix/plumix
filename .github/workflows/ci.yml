name: CI

on:
  pull_request:
    branches: ["*"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 3
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      # Runs on each push, not on a title edit: the default `pull_request` types leave `edited` out.
      - name: Keep "claude" out of the branch name and PR title
        run: node scripts/check-pr-names.ts --branch="$PR_HEAD_REF" --title="$PR_TITLE"
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}

  changesets:
    name: Changesets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - name: Block >= 1.0.0 while in 0.x
        run: pnpm check-no-major

  # Builds the workspace once into the turbo remote cache, so each job that `needs: build`
  # restores this commit's `dist/` instead of every job rebuilding it cold at the same time.
  # Turbo keys each artifact on the hash of its inputs, so a job never reads another commit's
  # build: a miss rebuilds. A fork has no token and so no cache to warm, so the steps skip.
  # The dependents run under `!cancelled()`: when this job fails, each one rebuilds and fails on
  # its own, rather than being skipped, which a required check would count as a pass.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.TURBO_TOKEN != ''
        uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - if: env.TURBO_TOKEN != ''
        run: pnpm build

  lint:
    name: Lint
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Not `pnpm lint`: turbo hashes args after `--` into every task, `^build` included, so its
      # ESLint cache flags would miss the Build job's cache. A fresh runner has no ESLint cache.
      - run: pnpm exec turbo run lint --continue

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format

  typecheck:
    name: Typecheck
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  knip:
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: pnpm knip

  migrations:
    name: Migrations
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # drizzle-kit imports `plumix/schema`, which resolves to `dist/`.
      - run: pnpm exec turbo run build --filter plumix
      - run: pnpm migrations:check

  i18n:
    name: i18n
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm i18n:check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - run: pnpm test:unit

  sandcastle:
    name: Sandcastle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: pnpm --dir .sandcastle install --frozen-lockfile
      - run: pnpm --dir .sandcastle typecheck
      - run: pnpm --dir .sandcastle test
      - run: pnpm --dir .sandcastle run ship --status
      - run: pnpm --dir .sandcastle run ship --report

  smoke:
    name: Smoke (scaffold)
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      - run: pnpm smoke:scaffold

      # Where the editor spec each all-plugins combo runs under `plumix dev` writes them.
      # Explicit paths, not `**/…`: that globber follows symlinks through `node_modules/.pnpm`.
      - name: Upload Playwright reports + traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-playwright-reports
          path: |
            packages/create-plumix-app/playwright-report/
            packages/create-plumix-app/test-results/
          if-no-files-found: warn
          retention-days: 5

  test-e2e:
    name: Test (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: "true"

      - run: pnpm test:e2e

      # No `if: always()`: playwright clears `playwright-report/` and `test-results/` as it
      # starts, which would delete a failed suite's artifacts before the upload below.
      - name: Assert the committed docs screenshots are the ones the capture produces
        id: screenshots
        run: |
          pnpm docs:screenshots
          git diff --exit-code -- apps/docs/src/assets/screenshots

      - name: Upload the recaptured screenshots
        if: failure() && steps.screenshots.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-screenshots
          path: apps/docs/src/assets/screenshots
          retention-days: 7

      # Explicit paths, not `**/…`: that globber follows symlinks through `node_modules/.pnpm`.
      - name: Upload Playwright reports + traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-reports
          path: |
            packages/*/playwright-report/
            packages/*/*/playwright-report/
            apps/*/playwright-report/
            packages/*/test-results/
            packages/*/*/test-results/
            apps/*/test-results/
          if-no-files-found: warn
          retention-days: 5

  publint:
    name: Publint
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm publint
      - run: pnpm surface:check

  attw:
    name: Are The Types Wrong
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm attw

  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: typos
      - name: Spellcheck markdown
        run: git ls-files '*.md' '*.mdx' | xargs -r typos

  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A docs route (`/fields/text/`) is read as the `.mdx` file at that path.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --hidden --include-fragments --no-progress --extensions md,mdx
            --root-dir '${{ github.workspace }}/apps/docs/src/content/docs'
            --remap '^file://${{ github.workspace }}/apps/docs/src/content/docs/([^.#]+?)/?(#.*)?$ file://${{ github.workspace }}/apps/docs/src/content/docs/$1.mdx$2'
            .
          fail: true
