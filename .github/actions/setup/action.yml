name: "Setup and install"
description: "Common setup steps for CI"

inputs:
  turbo-cache:
    description: "Restore and save the local turbo cache"
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: true

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: ".nvmrc"

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ".bun-version"

    - shell: bash
      run: pnpm install --frozen-lockfile

    - if: inputs.turbo-cache == 'true'
      shell: bash
      run: echo "TURBO_CACHE_DIR=.turbo/cache" >> "$GITHUB_ENV"

    - if: inputs.turbo-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ github.job }}-${{ github.sha }}
        restore-keys: turbo-${{ github.job }}-
