name: "Setup and install"
description: "Common setup steps for CI"

inputs:
  playwright:
    description: "Install Chromium and its system dependencies for Playwright"
    default: "false"
  playwright-save:
    description: "Save the Playwright browsers on main. One job per run sets it, so jobs don't race for the key"
    default: "false"
  turbo-cache:
    description: "Restore the local turbo cache, and save it on main"
    default: "true"
  turbo-cache-key:
    description: "Tells apart the turbo caches of jobs that share an id, such as matrix shards"
    default: ""

runs:
  using: composite
  steps:
    # A job container mounts the checkout apart from HOME, where pnpm keeps its store, and pnpm
    # warns that it cannot hard-link across them. Its store sits beside the checkout instead.
    - if: job.container.id != ''
      shell: bash
      run: echo "pnpm_config_store_dir=$(dirname "$GITHUB_WORKSPACE")/.pnpm-store" >> "$GITHUB_ENV"

    # CI also runs on main, so only the Release workflow saves the store, as before.
    - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        cache: true
        save-cache: ${{ github.ref == 'refs/heads/main' && github.workflow == 'Release' }}

    - if: job.container.id == ''
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ".bun-version"

    # setup-bun unpacks a zip, and the Playwright image has no `unzip`. npm ships Bun as a tarball.
    - if: job.container.id != ''
      shell: bash
      run: |
        npm install --prefix "$RUNNER_TEMP/bun" --no-save --no-audit --no-fund "bun@$(cat .bun-version)"
        echo "$RUNNER_TEMP/bun/node_modules/.bin" >> "$GITHUB_PATH"

    # The installed Playwright, not the lockfile: it is what names the browser build it downloads.
    - if: inputs.playwright == 'true'
      id: playwright
      shell: bash
      run: echo "version=$(pnpm --filter @plumix/admin exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    # Main saves the browsers; every other ref restores main's copy (or its base branch's).
    - if: inputs.playwright == 'true' && github.ref == 'refs/heads/main' && inputs.playwright-save == 'true'
      id: playwright-cache-save
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium

    - if: inputs.playwright == 'true' && !(github.ref == 'refs/heads/main' && inputs.playwright-save == 'true')
      id: playwright-cache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium

    - if: inputs.playwright == 'true' && steps.playwright-cache-save.outputs.cache-hit != 'true' && steps.playwright-cache-restore.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter @plumix/admin exec playwright install --with-deps chromium

    # The system packages Chromium links against live outside the cached directory.
    - if: inputs.playwright == 'true' && (steps.playwright-cache-save.outputs.cache-hit == 'true' || steps.playwright-cache-restore.outputs.cache-hit == 'true')
      shell: bash
      run: pnpm --filter @plumix/admin exec playwright install-deps chromium

    - if: inputs.turbo-cache == 'true'
      shell: bash
      run: echo "TURBO_CACHE_DIR=.turbo/cache" >> "$GITHUB_ENV"

    # Main saves one entry per job per commit from an empty directory, so an entry holds only that
    # commit's outputs; ci.yml's `prune-turbo-cache` keeps the newest. Every other ref restores
    # main's newest. The `/` ends the job id, so `turbo-test/` never matches `turbo-test-e2e-…`.
    - if: inputs.turbo-cache == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ github.job }}${{ inputs.turbo-cache-key && format('-{0}', inputs.turbo-cache-key) || '' }}/${{ github.sha }}

    - if: inputs.turbo-cache == 'true' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ github.job }}${{ inputs.turbo-cache-key && format('-{0}', inputs.turbo-cache-key) || '' }}/${{ github.sha }}
        restore-keys: turbo-${{ github.job }}${{ inputs.turbo-cache-key && format('-{0}', inputs.turbo-cache-key) || '' }}/
