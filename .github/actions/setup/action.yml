name: "Setup and install"
description: "Common setup steps for CI"

inputs:
  save-pnpm-store:
    description: >-
      Save the pnpm store to the Actions cache when its key missed. Jobs that
      install in parallel would all race to reserve the same key, so one job
      per workflow saves and the rest only restore.
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: ".nvmrc"

    - id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # A lockfile change gives the key a new hash; restore-keys falls back to the
    # closest older store, so install fetches only what changed.
    - if: inputs.save-pnpm-store == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - if: inputs.save-pnpm-store != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    # The Bun runtime's suites run on real Bun, at the version the repo pins.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ".bun-version"

    - shell: bash
      run: pnpm install --frozen-lockfile

    # The saving job's store started from an older store via restore-keys;
    # drop what this lockfile no longer references so the cache doesn't grow
    # with every lockfile change.
    - if: inputs.save-pnpm-store == 'true'
      shell: bash
      run: pnpm store prune
