name: "Setup and install"
description: "Common setup steps for CI"

inputs:
  save-pnpm-store:
    description: >-
      Save the pnpm store to the Actions cache when its key missed. Jobs that
      install in parallel would all race to reserve the same key, so one job
      per workflow saves and the rest only restore.
    default: "false"
  turbo-cache:
    description: >-
      Restore and save this job's local turbo cache. Off in a job that never
      runs turbo, which would otherwise have no cache directory to save.
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ".nvmrc"

    - id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # A lockfile change gives the key a new hash; restore-keys falls back to the
    # closest older store, so install fetches only what changed.
    - if: inputs.save-pnpm-store == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - if: inputs.save-pnpm-store != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    # The Bun runtime's suites run on real Bun, at the version the repo pins.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ".bun-version"

    - shell: bash
      run: pnpm install --frozen-lockfile

    # The saving job's store started from an older store via restore-keys;
    # drop what this lockfile no longer references so the cache doesn't grow
    # with every lockfile change.
    - if: inputs.save-pnpm-store == 'true'
      shell: bash
      run: pnpm store prune

    # Turbo checks its local cache before the remote one and never opens a
    # connection when the local copy answers. Without this every job starts
    # empty, so all ~40 of its tasks go to the remote at once — seventeen jobs
    # doing that concurrently is what the remote answers with 429s, which is
    # why a docs-only pull request still re-ran 26 of 39 lint tasks.
    #
    # The whole build/lint/typecheck/publint/attw cache measures ~24 MB, so
    # this is small against the repository's Actions cache budget.
    #
    # Keyed per job: each one caches only the tasks it runs, and restores its
    # own previous state rather than racing the other sixteen for one key.
    - if: inputs.turbo-cache == 'true'
      shell: bash
      run: echo "TURBO_CACHE_DIR=.turbo/cache" >> "$GITHUB_ENV"

    - if: inputs.turbo-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ github.job }}-${{ github.sha }}
        restore-keys: turbo-${{ github.job }}-
