name: "Setup and install"
description: "Common setup steps for CI"

inputs:
  turbo-cache:
    description: "Restore and save the local turbo cache"
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        cache: true
        save-cache: ${{ github.ref == 'refs/heads/main' }}

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ".bun-version"

    - if: inputs.turbo-cache == 'true'
      shell: bash
      run: echo "TURBO_CACHE_DIR=.turbo/cache" >> "$GITHUB_ENV"

    - if: inputs.turbo-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ github.job }}-${{ github.sha }}
        restore-keys: turbo-${{ github.job }}-
