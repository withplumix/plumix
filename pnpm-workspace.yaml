packages:
  - "apps/*"
  - "packages/admin"
  - "packages/admin-editor"
  - "packages/admin-ui"
  - "packages/blocks"
  - "packages/core"
  - "packages/create-plumix-app"
  - "packages/plumix"
  - "packages/runtimes/*"
  - "packages/runtimes/*/playground"
  - "packages/plugins/*"
  - "packages/plugins/*/playground"
  - "tooling/*"

# Default catalog: version-coordinated deps that aren't part of a multi-package
# family. Multi-package families live in the named catalogs below. Single-consumer
# deps (incl. the @oslojs/* auth stack, @hookform/resolvers, the prettier plugins)
# are not cataloged at all — they stay inline in their own package.json.
catalog:
  "@arethetypeswrong/cli": ^0.18.5
  "@axe-core/playwright": ^4.13.0
  "@libsql/client": ^0.17.4
  "@playwright/test": ^1.62.1
  "@types/node": ^24.13.3
  cmdk: ^1.1.1
  esbuild: ^0.28.2
  eslint: ^10.9.0
  fishery: ^2.4.0
  jsdom: ^29.1.1
  jsonc-parser: ^3.3.1
  prettier: ^3.9.6
  publint: ^0.3.24
  radix-ui: ^1.6.7
  react-hook-form: ^7.86.0
  sonner: ^2.0.8
  tailwind-merge: ^3.6.0
  typescript: ^6.0.3
  valibot: ^1.4.2

# Named catalogs group a multi-package family (2+ packages, 2+ consumers) under one
# handle, named to match its group in .github/dependabot.yml. Referenced as
# `catalog:<name>` from consumer package.json files.
catalogs:
  cloudflare:
    "@cloudflare/vite-plugin": ^1.53.1
    "@cloudflare/workers-types": ^5.20260823.1
    wrangler: ^4.125.0
  dnd-kit:
    "@dnd-kit/core": ^6.3.1
    "@dnd-kit/modifiers": ^9.0.0
    "@dnd-kit/sortable": ^10.0.0
    "@dnd-kit/utilities": ^3.2.2
  drizzle:
    drizzle-kit: ^0.31.10
    drizzle-orm: ^0.45.2
    drizzle-valibot: ^0.4.2
  lingui:
    "@lingui/babel-plugin-lingui-macro": ^6.6.0
    "@lingui/cli": ^6.6.0
    "@lingui/core": ^6.6.0
    "@lingui/format-po": ^6.6.0
    "@lingui/react": ^6.6.0
    "@lingui/vite-plugin": ^6.6.0
  orpc:
    "@orpc/client": ^1.15.0
    "@orpc/openapi": ^1.15.0
    "@orpc/server": ^1.15.0
    "@orpc/tanstack-query": ^1.15.0
    "@orpc/valibot": ^1.15.0
  oslojs:
    "@oslojs/crypto": ^1.0.1
    "@oslojs/encoding": ^1.1.0
    "@oslojs/webauthn": ^1.0.0
  react:
    "@types/react": ^19.2.18
    "@types/react-dom": ^19.2.5
    react: ^19.2.8
    react-dom: ^19.2.8
  tailwind:
    "@tailwindcss/node": ^4.3.3
    "@tailwindcss/oxide": ^4.3.3
    "@tailwindcss/postcss": ^4.3.3
    "@tailwindcss/typography": ^0.5.20
    "@tailwindcss/vite": ^4.3.3
    tailwindcss: ^4.3.3
  tanstack:
    "@tanstack/react-query": ^5.102.2
    "@tanstack/react-query-devtools": ^5.102.2
    "@tanstack/react-router": ^1.170.32
    "@tanstack/react-router-devtools": ^1.167.1
    "@tanstack/react-table": ^9.1.2
    "@tanstack/router-plugin": ^1.168.35
  testing-library:
    "@testing-library/jest-dom": ^7.0.1
    "@testing-library/react": ^16.3.2
    "@testing-library/user-event": ^14.6.6
  tiptap:
    "@tiptap/core": ^3.30.4
    # Explicit extension set for the rich-text rail instead of starter-kit,
    # which bundles ~16 extensions but we activate only these (the rest are
    # disabled marks we replace with @plumix/blocks marks, or nodes that are
    # standalone blocks). All pinned in lockstep with @tiptap/core so a single
    # prosemirror/core copy is bundled. @tiptap/pm is an exact-version peer of
    # every package here and rides along on that lockstep -- never pin it in
    # pnpm.overrides, which silently rewrites the peer range and forks it away
    # from the version tiptap expects.
    "@tiptap/extension-blockquote": ^3.30.3
    "@tiptap/extension-document": ^3.30.3
    "@tiptap/extension-hard-break": ^3.30.3
    "@tiptap/extension-heading": ^3.30.3
    "@tiptap/extension-list": ^3.30.3
    "@tiptap/extension-paragraph": ^3.30.3
    "@tiptap/extension-text": ^3.30.3
    "@tiptap/extensions": ^3.30.3
    "@tiptap/react": ^3.30.3
  vite:
    "@vitejs/plugin-react": ^6.1.0
    vite: ^8.2.2
  vitest:
    "@vitest/coverage-v8": ^4.1.11
    vitest: ^4.1.11

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-astro
  - prettier-plugin-tailwindcss
