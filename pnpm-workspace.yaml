# Plugin playgrounds are listed by name: not every plugin has one, and sherif
# warns about any `packages/plugins/*/playground` expansion that names no package.
packages:
  - "apps/*"
  - "packages/admin"
  - "packages/admin-editor"
  - "packages/admin-ui"
  - "packages/core"
  - "packages/create-plumix-app"
  - "packages/plumix"
  - "packages/runtimes/*"
  - "packages/runtimes/*/playground"
  - "packages/plugins/*"
  - "packages/plugins/audit-log/playground"
  - "packages/plugins/blog/playground"
  - "packages/plugins/comments/playground"
  - "packages/plugins/feeds/playground"
  - "packages/plugins/forms/playground"
  - "packages/plugins/media/playground"
  - "packages/plugins/menu/playground"
  - "packages/plugins/og/playground"
  - "packages/plugins/pages/playground"
  - "packages/plugins/seo/playground"
  - "tooling/*"

# Let a release age a week before resolving to it, matching the Dependabot
# cooldown in .github/dependabot.yml, so a local `pnpm install` cannot adopt a
# version Dependabot would still be holding back.
minimumReleaseAge: 10080
# A security override may name a version younger than that. List the package
# here while it does, and drop it the next time the override is refreshed.
minimumReleaseAgeExclude:
  - handlebars # 4.7.10 closes GHSA-p8wg-vrv2-v86f, GHSA-8r5x-fm3f-whwj, GHSA-xw65-4hp5-5hc7

# Every dependency build script needs a decision, or pnpm prints a warning on
# each install. These only fetch or check a platform binary, which already
# arrives as an optional dependency.
allowBuilds:
  esbuild: false
  unrs-resolver: false
  workerd: false

# Security and compatibility overrides. pnpm 11+ reads them only from here, not
# from a `pnpm` field in package.json.
overrides:
  "@types/node@>=25": "catalog:"
  "esbuild@<0.25.0": ">=0.25.0"
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  "ws@>=8.0.0 <8.21.0": ">=8.21.0"
  "brace-expansion@<1.1.21": ">=1.1.21 <2"
  "brace-expansion@>=4.0.0 <5.0.12": ">=5.0.12 <6"
  "undici@>=7.0.0 <7.29.1": ">=7.29.1 <8"
  "undici@>=8.0.0 <8.10.2": ">=8.10.2 <9"
  "js-yaml@>=3.0.0 <3.15.1": ">=3.15.1 <4"
  "js-yaml@>=4.0.0 <4.3.2": ">=4.3.2 <5"
  "postcss@<8.5.23": ">=8.5.23"
  "fast-uri@>=3.0.0 <3.1.7": ">=3.1.7 <4"
  "hono@<4.13.5": ">=4.13.5 <5"
  "@hono/node-server@<1.19.15": ">=1.19.15 <2"
  "body-parser@<2.3.0": ">=2.3.0"
  "qs@<6.16.0": ">=6.16.0 <7"
  "sharp@<0.35.5": ">=0.35.5 <0.36"
  "nanoid@<3.3.17": ">=3.3.17 <4"
  "ip-address@<10.5.1": ">=10.5.1 <11"
  "moment@>=2.29.2 <2.31.0": ">=2.31.0 <3"
  "devalue@<5.9.3": ">=5.9.3 <6"
  "shell-quote@>=1.8.4 <1.11.0": ">=1.11.0 <2"
  "seroval@<1.6.3": ">=1.6.3 <2"
  "proxy-addr@<2.0.8": ">=2.0.8 <3"
  "postcss-selector-parser@<7.1.6": ">=7.1.6 <8"
  "source-map-js@<1.2.2": ">=1.2.2 <2"
  "smol-toml@<1.9.0": ">=1.9.0 <2"
  "handlebars@<4.7.10": ">=4.7.10 <5"

# Default catalog: version-coordinated deps that aren't part of a multi-package
# family. Multi-package families live in the named catalogs below. Single-consumer
# deps (incl. the @oslojs/* auth stack, @hookform/resolvers, the prettier plugins)
# are not cataloged at all — they stay inline in their own package.json.
catalog:
  "@arethetypeswrong/cli": ^0.18.5
  "@axe-core/playwright": ^4.13.0
  "@libsql/client": ^0.18.0
  "@playwright/test": ^1.63.0
  "@types/node": ^24.13.4
  cmdk: ^1.1.1
  esbuild: ^0.28.2
  eslint: ^10.11.0
  fishery: ^2.4.0
  jsonc-parser: ^3.3.1
  playwright: ^1.63.0
  prettier: ^3.9.9
  publint: ^0.3.24
  radix-ui: ^1.6.7
  react-hook-form: ^7.89.0
  sharp: ^0.35.5
  sonner: ^2.0.8
  tailwind-merge: ^3.7.0
  tsx: 4.23.15
  typescript: ^6.0.3
  valibot: ^1.5.0

# Named catalogs group a multi-package family (2+ packages, 2+ consumers) under one
# handle, named to match its group in .github/dependabot.yml. Referenced as
# `catalog:<name>` from consumer package.json files.
catalogs:
  cloudflare:
    "@cloudflare/vite-plugin": ^1.62.4
    "@cloudflare/workers-types": ^5.20261001.1
    wrangler: ^4.146.0
  dnd-kit:
    "@dnd-kit/core": ^6.3.1
    "@dnd-kit/modifiers": ^9.0.0
    "@dnd-kit/sortable": ^10.0.0
    "@dnd-kit/utilities": ^3.2.2
  drizzle:
    drizzle-kit: ^0.31.11
    drizzle-orm: ^0.45.3
    drizzle-valibot: ^0.4.2
  lingui:
    "@lingui/babel-plugin-lingui-macro": ^6.8.0
    "@lingui/cli": ^6.8.0
    "@lingui/core": ^6.8.0
    "@lingui/format-po": ^6.8.0
    "@lingui/react": ^6.8.0
    "@lingui/vite-plugin": ^6.8.0
  orpc:
    "@orpc/client": ^1.15.3
    "@orpc/openapi": ^1.15.3
    "@orpc/server": ^1.15.3
    "@orpc/standard-server-fetch": ^1.15.3
    "@orpc/tanstack-query": ^1.15.3
    "@orpc/valibot": ^1.15.3
  oslojs:
    "@oslojs/crypto": ^1.0.1
    "@oslojs/encoding": ^1.1.0
    "@oslojs/webauthn": ^1.0.0
  react:
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    react: ^19.3.0
    react-dom: ^19.3.0
  tailwind:
    "@tailwindcss/node": ^4.3.3
    "@tailwindcss/oxide": ^4.3.3
    "@tailwindcss/postcss": ^4.3.3
    "@tailwindcss/typography": ^0.5.20
    "@tailwindcss/vite": ^4.3.3
    tailwindcss: ^4.3.3
  tanstack:
    "@tanstack/react-query": ^5.103.2
    "@tanstack/react-query-devtools": ^5.103.2
    "@tanstack/react-router": ^1.170.38
    "@tanstack/react-router-devtools": ^1.167.2
    "@tanstack/react-table": ^9.2.4
    "@tanstack/router-plugin": ^1.168.40
  testing-library:
    "@testing-library/jest-dom": ^7.0.1
    "@testing-library/react": ^16.3.3
    "@testing-library/user-event": ^14.6.7
  tiptap:
    "@tiptap/core": ^3.31.3
    # Explicit extension set for the rich-text rail instead of starter-kit,
    # which bundles ~16 extensions but we activate only these (the rest are
    # disabled marks we replace with the core block marks, or nodes that are
    # standalone blocks). All pinned in lockstep with @tiptap/core so a single
    # prosemirror/core copy is bundled. @tiptap/pm is an exact-version peer of
    # every package here and rides along on that lockstep -- never pin it in
    # `overrides`, which silently rewrites the peer range and forks it away
    # from the version tiptap expects.
    "@tiptap/extension-blockquote": ^3.31.3
    "@tiptap/extension-document": ^3.31.3
    "@tiptap/extension-hard-break": ^3.31.3
    "@tiptap/extension-heading": ^3.31.3
    "@tiptap/extension-list": ^3.31.3
    "@tiptap/extension-paragraph": ^3.31.3
    "@tiptap/extension-text": ^3.31.3
    "@tiptap/extensions": ^3.31.3
    "@tiptap/react": ^3.31.3
  vite:
    "@vitejs/plugin-react": ^6.1.1
    vite: ^8.3.2
  vitest:
    "@vitest/browser-playwright": ^5.0.3
    "@vitest/coverage-v8": ^5.0.3
    vitest: ^5.0.3

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-astro
  - prettier-plugin-tailwindcss
